<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Dashboard - REST API</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    /* ========== RESET & DASAR ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    /* ========== KARTU SENSOR ========== */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card .label {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card .value {
      font-size: 42px;
      font-weight: bold;
      margin: 10px 0;
      color: #667eea;
    }

    .card .value.small {
      font-size: 22px;
    }

    .card .unit {
      font-size: 18px;
      color: #aaa;
    }

    /* ========== BADGE STATUS ========== */
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
    }

    .status-online {
      background: #d4edda;
      color: #155724;
    }

    .status-offline {
      background: #f8d7da;
      color: #721c24;
    }

    /* ========== PANEL ========== */
    .panel {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      margin-bottom: 25px;
    }

    .panel h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #444;
    }

    /* ========== TOMBOL KONTROL ========== */
    .controls {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:focus-visible {
      outline: 3px solid #333;
      outline-offset: 2px;
    }

    .btn-on {
      background: #28a745;
      color: white;
    }

    .btn-on:hover {
      background: #218838;
    }

    .btn-off {
      background: #dc3545;
      color: white;
    }

    .btn-off:hover {
      background: #c82333;
    }

    /* ========== TABEL HISTORY ========== */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    th {
      background: #f8f9fa;
      color: #666;
      text-transform: uppercase;
      font-size: 12px;
    }

    tr:hover td {
      background: #f9f9f9;
    }

    .empty-row {
      text-align: center;
      color: #999;
    }

    /* ========== LOG AKTIVITAS ========== */
    #log {
      background: #1e1e1e;
      color: #0f0;
      font-family: monospace;
      padding: 15px;
      border-radius: 10px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    #log .error {
      color: #f66;
    }

    #log .info {
      color: #6af;
    }

    .input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      width: 160px;
    }

    .alert-box {
      background: #f8d7da;
      color: #721c24;
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🌡️ IoT Dashboard — REST API</h1>

    <!-- ===== Kartu Sensor ===== -->
    <section class="cards">
      <div class="card">
        <div class="label">Suhu</div>
        <div class="value" id="suhu">--</div>
        <div class="unit">°C</div>
      </div>

      <div class="card">
        <div class="label">Kelembaban</div>
        <div class="value" id="kelembaban">--</div>
        <div class="unit">%</div>
      </div>

      <div class="card">
        <div class="label">Status Sensor</div>
        <div class="value small">
          <span class="status-badge status-offline" id="status-badge">OFFLINE</span>
        </div>
      </div>
    </section>

    <!-- ===== Kontrol ===== -->
    <section class="panel">
      <h2>💡 Kontrol Perangkat</h2>
      <div class="controls">
        <button class="btn btn-on" data-device="lamp" data-action="on">Nyalakan Lampu</button>
        <button class="btn btn-off" data-device="lamp" data-action="off">Matikan Lampu</button>
      </div>
    </section>

    <!-- Threshold -->
    <div class="panel">
      <h2>🌡️ Batas Suhu (Threshold)</h2>
      <div id="alert-box" class="alert-box" style="display:none;"></div>
      <div class="controls">
        <input type="number" id="input-threshold" class="input" step="0.1" placeholder="Contoh: 30">
        <button class="btn btn-on" onclick="setThreshold()">Simpan Batas</button>
      </div>
      <p style="margin-top:10px;color:#888;font-size:14px;">
        Batas saat ini: <b id="threshold-now">--</b> °C
      </p>
    </div>

    <!-- Grafik -->
    <div class="panel">
      <h2>📈 Grafik Real-time</h2>
      <div style="position:relative; height:300px;">
        <canvas id="sensorChart"></canvas>
      </div>
    </div>

    <!-- ===== History ===== -->
    <section class="panel">
      <h2>📊 10 Data Sensor Terakhir</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Suhu (°C)</th>
              <th>Kelembaban (%)</th>
            </tr>
          </thead>
          <tbody id="history-body">
            <tr>
              <td colspan="3" class="empty-row">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ===== Log ===== -->
    <section class="panel">
      <h2>📝 Log Aktivitas</h2>
      <div id="log" aria-live="polite"></div>
    </section>
  </div>

  <script>
    // ==============================
    // KONFIGURASI
    // ==============================
    const API_BASE = 'http://localhost:1880/api';
    const API_KEY = 'iot-kampus-2026';

    // Wrapper fetch: otomatis menambahkan header X-API-Key
    function apiFetch(path, options = {}) {
      options.headers = Object.assign({ 'X-API-Key': API_KEY }, options.headers || {});
      return fetch(`${API_BASE}${path}`, options);
    }

    const SENSOR_INTERVAL = 3000;  // ms
    const HISTORY_INTERVAL = 5000;  // ms
    const HISTORY_LIMIT = 10;    // baris di tabel
    const LOG_LIMIT = 100;   // maksimal baris log

    // ==============================
    // ELEMEN DOM
    // ==============================
    const el = {
      suhu: document.getElementById('suhu'),
      kelembaban: document.getElementById('kelembaban'),
      badge: document.getElementById('status-badge'),
      historyBody: document.getElementById('history-body'),
      log: document.getElementById('log'),
    };

    // ==============================
    // UTILITAS
    // ==============================
    function log(msg, type = 'info') {
      const line = document.createElement('div');
      line.className = type;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      el.log.appendChild(line);

      // Batasi jumlah baris agar log tidak menumpuk
      while (el.log.children.length > LOG_LIMIT) {
        el.log.removeChild(el.log.firstChild);
      }
      el.log.scrollTop = el.log.scrollHeight;
    }

    // Fetch JSON + cek status HTTP (otomatis kirim X-API-Key lewat apiFetch)
    async function getJSON(path, options) {
      const res = await apiFetch(path, options);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function setStatus(online) {
      el.badge.textContent = online ? 'ONLINE' : 'OFFLINE';
      el.badge.className = `status-badge ${online ? 'status-online' : 'status-offline'}`;
    }

    function setHistoryMessage(text) {
      el.historyBody.innerHTML = '';
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 3;
      td.className = 'empty-row';
      td.textContent = text;
      tr.appendChild(td);
      el.historyBody.appendChild(tr);
    }

    // ==============================
    // GRAFIK (Chart.js)
    // ==============================
    let currentThreshold = null;

    const sensorChart = new Chart(document.getElementById('sensorChart'), {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Suhu (°C)',
            data: [],
            borderColor: '#e74c3c',
            backgroundColor: 'rgba(231,76,60,0.1)',
            tension: 0.3,
            pointRadius: 2,
            yAxisID: 'y'
          },
          {
            label: 'Kelembaban (%)',
            data: [],
            borderColor: '#3498db',
            backgroundColor: 'rgba(52,152,219,0.1)',
            tension: 0.3,
            pointRadius: 2,
            yAxisID: 'y1'
          },
          {
            label: 'Batas Suhu',
            data: [],
            borderColor: '#f39c12',
            borderDash: [6, 6],
            borderWidth: 2,
            pointRadius: 0,
            yAxisID: 'y'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          y: { type: 'linear', position: 'left', title: { display: true, text: 'Suhu (°C)' } },
          y1: { type: 'linear', position: 'right', title: { display: true, text: 'Kelembaban (%)' }, grid: { drawOnChartArea: false } }
        }
      }
    });

    function updateChart(data) {
      sensorChart.data.labels = data.map(d => new Date(d.received).toLocaleTimeString());
      sensorChart.data.datasets[0].data = data.map(d => d.suhu);
      sensorChart.data.datasets[1].data = data.map(d => d.kelembaban);
      sensorChart.data.datasets[2].data = data.map(() => currentThreshold);
      sensorChart.update();
    }

    // ==============================
    // TAMPILKAN DATA SENSOR (dipakai REST & WebSocket)
    // ==============================
    let lastAlert = false; // agar log peringatan tidak berulang

    function renderSensor(data, threshold, alert) {
      if (!data || data.suhu === null || data.suhu === undefined) {
        setStatus(false);
        return;
      }

      el.suhu.textContent = data.suhu;
      el.kelembaban.textContent = data.kelembaban;
      setStatus(true);

      currentThreshold = threshold;
      document.getElementById('threshold-now').textContent = threshold;

      const box = document.getElementById('alert-box');
      if (alert) {
        box.style.display = 'block';
        box.textContent = `⚠️ Peringatan: suhu ${data.suhu}°C melewati batas ${threshold}°C!`;
        if (!lastAlert) log(`⚠️ Suhu ${data.suhu}°C melewati batas ${threshold}°C`, 'error');
      } else {
        box.style.display = 'none';
      }
      lastAlert = alert;
    }

    // ==============================
    // TAMPILKAN HISTORY (tabel + grafik)
    // ==============================
    let historyData = [];

    function renderHistory(data) {
      if (!data || data.length === 0) {
        setHistoryMessage('Belum ada data');
        return;
      }

      updateChart(data);

      const rows = data.slice(-HISTORY_LIMIT).reverse().map(d => `
        <tr>
          <td>${new Date(d.received).toLocaleTimeString()}</td>
          <td>${d.suhu}</td>
          <td>${d.kelembaban}</td>
        </tr>`).join('');
      el.historyBody.innerHTML = rows;
    }

    // ==============================
    // DATA AWAL LEWAT REST (sekali, bukan polling)
    // ==============================
    async function fetchSensor() {
      try {
        const json = await getJSON('/suhu');
        renderSensor(json.data, json.threshold, json.alert);
      } catch (err) {
        log(`Gagal fetch sensor: ${err.message}`, 'error');
      }
    }

    async function fetchHistory() {
      try {
        const json = await getJSON('/history');
        historyData = json.data || [];
        renderHistory(historyData);
      } catch (err) {
        log(`Gagal fetch history: ${err.message}`, 'error');
      }
    }

    // ==============================
    // KONTROL PERANGKAT (POST /api/kontrol)
    // ==============================
    async function kontrol(device, action) {
      try {
        const json = await getJSON('/kontrol', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device, action }),
        });

        if (json.status === 'success') {
          log(`✓ Perintah terkirim: ${device} → ${action}`);
        } else {
          log(`✗ Gagal: ${json.message}`, 'error');
        }
      } catch (err) {
        log(`✗ Error kontrol: ${err.message}`, 'error');
      }
    }

    async function setThreshold() {
      const nilai = document.getElementById('input-threshold').value;
      if (nilai === '') {
        log('✗ Isi nilai batas suhu dulu', 'error');
        return;
      }
      try {
        const res = await apiFetch('/threshold', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ suhu_max: Number(nilai) })
        });
        const json = await res.json();
        if (json.status === 'success') {
          log(`✓ Batas suhu diubah menjadi ${json.suhu_max}°C`, 'info');
          document.getElementById('threshold-now').textContent = json.suhu_max;
          currentThreshold = json.suhu_max;
        } else {
          log(`✗ Gagal: ${json.message}`, 'error');
        }
      } catch (err) {
        log(`✗ Error threshold: ${err.message}`, 'error');
      }
    }

    // Pasang event ke semua tombol kontrol
    document.querySelectorAll('[data-device]').forEach(btn => {
      btn.addEventListener('click', () => {
        kontrol(btn.dataset.device, btn.dataset.action);
      });
    });

    // ==============================
    // WEBSOCKET (update real-time tanpa polling)
    // ==============================
    const WS_URL = 'ws://localhost:1880/ws/sensor';
    const WS_RETRY = 3000; // ms, jeda sebelum mencoba menyambung ulang
    let ws = null;

    function connectWebSocket() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        log('✓ WebSocket tersambung, update real-time aktif');
        // Ambil data awal (juga mengejar data yang terlewat saat terputus)
        fetchSensor();
        fetchHistory();
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type !== 'sensor') return;

          renderSensor(msg.data, msg.threshold, msg.alert);

          historyData.push(msg.data);
          if (historyData.length > 50) historyData.shift();
          renderHistory(historyData);
        } catch (err) {
          log(`✗ Pesan WebSocket tidak valid: ${err.message}`, 'error');
        }
      };

      ws.onclose = () => {
        setStatus(false);
        log(`WebSocket terputus, mencoba lagi dalam ${WS_RETRY / 1000} detik...`, 'error');
        setTimeout(connectWebSocket, WS_RETRY);
      };

      ws.onerror = () => ws.close();
    }

    // ==============================
    // MULAI
    // ==============================
    log('Dashboard dimulai, menyambungkan WebSocket...');
    connectWebSocket();
  </script>
</body>

</html>
